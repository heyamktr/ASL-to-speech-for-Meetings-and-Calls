services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/app/models/asl_model.onnx
      - LOG_LEVEL=INFO
      # TEMP (end-to-end pipeline test): emit any top guess so the overlay/TTS
      # path is exercised regardless of accuracy. Revert to 0.4 (the default) when done.
      - CONFIDENCE_THRESHOLD=0.05
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
